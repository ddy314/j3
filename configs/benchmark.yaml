model:
  model_name: D32-1216-R12
  vocab_size: 16384
  d_model: 384
  depth: 32
  num_q_heads: 6
  num_kv_heads: 2
  head_dim: 64
  mlp_hidden_dim: 1216
  output_residual_rank: 12
  max_seq_len: 1024
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  initializer_range: 0.02
  xielu_alpha_p_init: 0.5
  xielu_alpha_n_init: 1.0
  xielu_beta: 0.5
  xielu_eps: -1.0e-6
  xielu_parameterization: softplus_constrained_v1
  tie_embeddings: true
  use_qk_norm: true
  use_bias: false

training:
  seed: 1234
  device: auto
  precision: bf16
  compile: false
  compile_mode: default
  tf32: true
  sequence_length: 1024
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_tokens: 1024
  total_tokens: 1024
  max_steps: 1
  max_tokens: null
  warmup_tokens: 0
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every_steps: 1000
  eval_every_tokens: 0
  checkpoint_every_minutes: 0
  permanent_checkpoint_every_tokens: 0
  keep_last_n: 1
  pin_memory: true

data:
  synthetic: true
  shuffle_shards: false
  eval_batches: 0
