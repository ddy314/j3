version: 1
name: j3-capability-oriented-cpt-125m

# Exact training-token quotas. Each JSONL/JSON/Parquet row in these folders is
# ordinary continuation text under the `text` field. No User:/Assistant: text
# is added by the extractor.
target_train_tokens: 125000000
output_dir: data/capability_cpt_tokenized
tokenizer: data/tokenized/tokenizer.json
shard_tokens: 4194304
val_ratio: 0.01
seed: 1337
deduplicate: true
decontamination_index: data/decontamination/public_benchmarks.npz

# The source directories are deliberately local: the repository does not
# assume a particular vendor/dataset license for capability data. Populate
# them with auditable rows before running the preparation command.
sources:
  - name: daily_narrative_event_continuation
    kind: local
    dataset: local
    category: daily_narrative_event_continuation
    local_subdir: data/capability_raw/narrative
    local_pattern: "*.json*"
    text_field: text
    token_budget: 37500000
    min_text_chars: 64
    filters: {}

  - name: commonsense_physics_explanations
    kind: local
    dataset: local
    category: commonsense_physics_explanation
    local_subdir: data/capability_raw/commonsense_physics
    local_pattern: "*.json*"
    text_field: text
    token_budget: 31250000
    min_text_chars: 64
    filters: {}

  - name: elementary_science_knowledge
    kind: local
    dataset: local
    category: elementary_science_knowledge_qa
    local_subdir: data/capability_raw/science_knowledge
    local_pattern: "*.json*"
    text_field: text
    token_budget: 25000000
    min_text_chars: 48
    filters: {}

  - name: coreference_reading_relation
    kind: local
    dataset: local
    category: coreference_reading_relation
    local_subdir: data/capability_raw/reading_relation
    local_pattern: "*.json*"
    text_field: text
    token_budget: 18750000
    min_text_chars: 48
    filters: {}

  - name: short_math_logic_reasoning
    kind: local
    dataset: local
    category: short_math_logic_reasoning
    local_subdir: data/capability_raw/math_logic
    local_pattern: "*.json*"
    text_field: text
    token_budget: 12500000
    min_text_chars: 32
    filters: {}
