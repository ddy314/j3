version: 1
name: j3-stage3-final-high-information-500m

# This is an exact 500M-token continuation corpus. It deliberately has no
# generic Web/SEO bucket: every source is long-form educational, scientific,
# encyclopedic, narrative, question-answer, or verified reasoning text.
target_train_tokens: 500000000
output_dir: data/stage3_final_tokenized
tokenizer: data/tokenized/tokenizer.json
shard_tokens: 4194304
val_ratio: 0.01
seed: 1337
deduplicate: true
decontamination_index: data/decontamination/public_benchmarks.npz

sources:
  # The supplied artifact is copied by exact token slice; its source manifest
  # contains 299,793,532 usable train tokens, so this stage uses the first 250M.
  - name: finepdfs_longform_250m
    kind: tokenized_manifest
    category: textbook_longform_pdf
    manifest: finepdfs_300m_tokenized/manifest.json
    target_train_tokens: 250000000

  # Curated Cosmopedia rows exclude the fineweb seed. The source retains
  # provenance labels so the three high-value styles remain auditable.
  - name: cosmopedia_stanford_textbook
    kind: hf
    category: synthetic_textbook
    dataset: ecreeth/cosmo_v2_filtered
    config: default
    split: train
    text_field: text
    token_budget: 40000000
    local_subdir: cosmopedia_filtered
    local_pattern: cosmo_v2_text.parquet
    min_text_chars: 256
    filters:
      seed_data_in: [stanford]

  - name: cosmopedia_synthetic_wikihow
    kind: hf
    category: synthetic_procedural_knowledge
    dataset: ecreeth/cosmo_v2_filtered
    config: default
    split: train
    text_field: text
    token_budget: 15000000
    local_subdir: cosmopedia_filtered
    local_pattern: cosmo_v2_text.parquet
    min_text_chars: 256
    filters:
      seed_data_in: [wikihow]
      format_in: [wikihow]

  - name: cosmopedia_synthetic_narrative
    kind: hf
    category: synthetic_coherent_narrative
    dataset: ecreeth/cosmo_v2_filtered
    config: default
    split: train
    text_field: text
    token_budget: 30000000
    local_subdir: cosmopedia_filtered
    local_pattern: cosmo_v2_text.parquet
    min_text_chars: 256
    filters:
      seed_data_in: [ultrachat, openhermes2.5]
      format_in: [story_reddit, story_children, story_morality, story_life_lessons, story_forums]

  - name: pes2o_scientific_explanations
    kind: existing_source
    category: scientific_explanations
    manifest: data/stage2_tokenized/manifest.json
    source_name: pes2o_s2ag
    token_budget: 75000000

  - name: wikitext_encyclopedia
    kind: existing_source
    category: encyclopedia
    manifest: data/stage3_tokenized/manifest.json
    source_name: wikitext_103
    token_budget: 30000000

  - name: openorca_qa_knowledge
    kind: hf
    category: qa_knowledge
    dataset: Open-Orca/OpenOrca
    config: default
    split: train
    text_field: question
    text_template: |-
      Question:
      {question}

      Answer:
      {response}
    token_budget: 55000000
    local_subdir: openorca
    local_pattern: 1M-GPT4-Augmented.parquet
    min_text_chars: 256
    filters: {}

  - name: openthoughts_verified_reasoning
    kind: hf
    category: synthetic_verified_reasoning
    dataset: open-r1/OpenThoughts-114k-math
    config: default
    split: train
    text_field: problem
    text_template: |-
      Problem:
      {problem}

      Reasoning and solution:
      {solution}
    token_budget: 5000000
    local_subdir: openthoughts
    local_pattern: train-*.parquet
    min_text_chars: 256
    filters:
      correct_in: [true]
      generated_token_count_min: 256
