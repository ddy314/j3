[project]
name = "j3"
version = "0.1.0"
description = "A small, resumable, GPU-optimized language-model pretraining system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=5.49.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.21.0",
    "torch>=2.14.0",
]

[project.optional-dependencies]
data = [
    "datasets>=5.0.0",
    "huggingface-hub>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]

preview = false
